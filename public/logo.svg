<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle wallet body -->
  <rect x="48" y="128" width="416" height="256" rx="48" ry="48" fill="url(#grad1)"/>
  
  <!-- Card slot on right side -->
  <rect x="352" y="192" width="128" height="128" rx="24" ry="24" fill="rgba(255,255,255,0.25)"/>
  
  <!-- Center circle (coin) -->
  <circle cx="416" cy="256" r="32" fill="white"/>
  
  <!-- Dollar sign on coin -->
  <text x="416" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FF4500">$</text>
</svg>
